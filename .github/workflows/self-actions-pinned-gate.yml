# Self-caller: this repo HOSTS the reusable gate workflows (workflow_call-only),
# so without thin callers of its own, its PRs can never produce the org-baseline
# required contexts. Same double-pinned caller convention as every consumer repo;
# pinned to already-merged trusted SHAs so a PR that edits gate logic is still
# checked by the current trusted gate version, not by its own modified copy.
name: actions-pinned-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actions-pinned-gate:
    uses: cinatra-ai/ci/.github/workflows/actions-pinned-gate.yml@4c903fe9ca71ad47752a2bc92b72893e5f7c9814 # 0.1.0
    with:
      ref: 4c903fe9ca71ad47752a2bc92b72893e5f7c9814
