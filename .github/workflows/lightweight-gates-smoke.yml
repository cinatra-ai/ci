name: lightweight-gates-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-pinned:
    uses: ./.github/workflows/actions-pinned-gate.yml
    with:
      ref: ${{ github.sha }}
      use_slim: true
  gitignore:
    uses: ./.github/workflows/gitignore-gate.yml
    with:
      ref: ${{ github.sha }}
      use_slim: true
  source-leak:
    uses: ./.github/workflows/source-leak-gate.yml
    with:
      ref: ${{ github.sha }}
      use_slim: true
      config: config/source-leak.json
  regression-tests:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Runner selection and gate refusal cases
        run: >-
          node --test
          scripts/__tests__/lightweight-runner.test.mjs
          scripts/__tests__/actions-pinned-gate.test.mjs
          scripts/__tests__/gitignore-gate.test.mjs
          scripts/__tests__/source-leak-gate.test.mjs
          scripts/__tests__/source-leak-ratchet.test.mjs
          scripts/__tests__/source-leak-pathscan.test.mjs
          scripts/__tests__/resolve-diff-base.test.mjs
