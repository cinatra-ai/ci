# Self-caller for the org baseline source-leak gate — see self-actions-pinned-gate.yml
# for why this repo needs its own thin callers.
name: source-leak-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-leak-gate:
    uses: cinatra-ai/ci/.github/workflows/source-leak-gate.yml@00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e # v0.1.2-next.00ac7b9
    with:
      profile: default
      ratchet_mode: line
      # Narrow self-referential-name exemptions (this repo ships the gates it
      # runs; see the $comment in the config file).
      config: config/source-leak.json
      ref: 00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e
