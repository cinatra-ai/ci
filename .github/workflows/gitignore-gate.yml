name: gitignore-gate

# Reusable workflow. A consuming repo calls it from its own thin caller, e.g.:
#
#   jobs:
#     gitignore-gate:
#       uses: cinatra-ai/ci/.github/workflows/gitignore-gate.yml@<sha>  # vX.Y.Z
#
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref of this gate repo to check out (pin to a SHA in production)."
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  gitignore-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: cinatra-ai/ci
          ref: ${{ inputs.ref }}
          path: .gitignore-gate

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Run gate
        run: node .gitignore-gate/scripts/gitignore-gate.mjs
