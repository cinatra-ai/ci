name: secret-scan-gate

# Reusable secret-scan gate. Engine = TruffleHog OSS.
# Mirrors ci/.github/workflows/source-leak-gate.yml in structure/naming so the
# emitted required status context is exactly "secret-scan-gate / secret-scan-gate"
# (workflow name `/` job key, both `secret-scan-gate`).
#
# A consuming repo calls it from its own thin caller, e.g.:
#
#   jobs:
#     secret-scan-gate:
#       uses: cinatra-ai/ci/.github/workflows/secret-scan-gate.yml@<sha>  # vX.Y.Z
#       with:
#         base_sha: ${{ github.event.pull_request.base.sha }}
#         head_sha: ${{ github.event.pull_request.head.sha }}
#
# NOTE vs source-leak-gate: there is NO second checkout of cinatra-ai/ci and NO
# `ref:` inner-pin input, because the engine is the upstream TruffleHog action
# (not a ci-repo scripts/*.mjs). The only mutable surface is the TruffleHog
# action itself, which is SHA-pinned below (satisfies actions-pinned-gate). The
# scanner ENGINE version is also pinned (`version: "3.97.9"`) so CI matches the
# baseline sweep's :3.97.9 image instead of the floating :latest tag.
# The floor is 3.97.7, the first engine that scans the true base..head range
# (trufflesecurity/trufflehog#5325). Older engines walk `git log <head>` and stop
# at the base commit, so on a PR that merged its base branch they skip every PR
# commit dated before that base and still exit 0. 3.95.5 also missed a value on
# the line after a line longer than 64 KiB.
# scripts/__tests__/secret-scan-engine-pin.test.mjs holds the floor and the parity.
on:
  workflow_call:
    inputs:
      base_sha:
        description: "Diff base commit SHA (PR: pull_request.base.sha). Empty => the event's base; see the Resolve scan range step."
        type: string
        default: ""
      head_sha:
        description: "Diff head commit SHA (PR: pull_request.head.sha). Empty => the event's head, else HEAD."
        type: string
        default: ""
      extra_args:
        description: "Optional extra TruffleHog CLI args appended after the gate defaults (e.g. --exclude-paths=.trufflehog-exclude)."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secret-scan-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # full history so base..head range scanning resolves

      # Decide the scan range per event, so that --fail-on-scan-errors (below) fails
      # a broken range without turning a legitimate force-push or first push red.
      # Outputs: mode (range | full | none), base and head (full commit SHAs).
      # - pull_request, pull_request_target, merge_group: base..head. The base and the
      #   head must resolve; a commit missing from the clone is fetched once by SHA
      #   (a fork PR head under pull_request_target). Otherwise the step fails.
      # - push: before..after. An empty or all-zero `before` (the first push of a
      #   ref) scans the full history of `after`. After a force-push, `before` is in
      #   no fetched ref: it is fetched by SHA (GitHub keeps serving a commit that a
      #   force-push removed) and the scan starts at merge-base(before, after), that
      #   is exactly the new commits. If it cannot be fetched, the full history of
      #   `after` is scanned. A push that only moves the ref back to an ancestor, or
      #   deletes it, adds no commits: a notice, and no scan.
      # - any other event without a base: the full history of the head.
      # Every fallback logs an annotation; nothing is skipped silently. The event is
      # read through env only (no expression in the script).
      - name: Resolve scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_BASE: ${{ inputs.base_sha }}
          IN_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          note() { echo "::notice title=secret-scan-gate::$*"; }
          warn() { echo "::warning title=secret-scan-gate::$*"; }
          die() { echo "::error title=secret-scan-gate::$*"; exit 1; }
          is_zero() { [[ $1 =~ ^0+$ ]]; }
          for v in "$IN_BASE" "$IN_HEAD" "$PR_BASE" "$PR_HEAD" "$MG_BASE" "$MG_HEAD" "$PUSH_BEFORE" "$PUSH_AFTER"; do
            [[ $v == -* ]] && die "refusing an option-like revision: $v"
          done
          # commit <rev>: print the full SHA of the commit <rev> names. A full hex SHA that
          # is not in the clone is fetched once by SHA. Prints nothing and fails otherwise.
          commit() {
            local v=$1
            if [ -z "$v" ] || is_zero "$v"; then return 1; fi
            git rev-parse --verify --quiet "$v^{commit}" && return 0
            if [[ $v =~ ^[0-9a-f]{40}$ || $v =~ ^[0-9a-f]{64}$ ]]; then
              git fetch --quiet --no-tags --no-recurse-submodules origin "$v" >/dev/null 2>&1 || true
              git rev-parse --verify --quiet "$v^{commit}" && return 0
            fi
            return 1
          }
          emit() {
            { echo "mode=$1"; echo "base=$2"; echo "head=$3"; } >> "$GITHUB_OUTPUT"
            echo "secret-scan-gate: event=$EVENT_NAME mode=$1 base=${2:-<none>} head=${3:-<none>}"
          }
          if [ "$EVENT_NAME" = push ]; then
            before=${IN_BASE:-$PUSH_BEFORE}
            after=${IN_HEAD:-${PUSH_AFTER:-HEAD}}
            if is_zero "$after"; then
              note "push deleted the ref (after is all-zero): no commits to scan"
              emit none "" ""
              exit 0
            fi
            head=$(commit "$after") || die "push head $after is not a commit in this clone and could not be fetched"
            if [ -z "$before" ] || is_zero "$before"; then
              warn "push has no before commit (first push of this ref): scanning the full history of $head"
              emit full "" "$head"
            elif base=$(commit "$before"); then
              mb=$(git merge-base "$base" "$head") || mb=""
              if [ -z "$mb" ]; then
                warn "push before $base shares no history with $head: scanning the full history of $head"
                emit full "" "$head"
              elif [ "$mb" = "$head" ]; then
                note "push moved the ref back to $head, an ancestor of $base: no new commits to scan"
                emit none "" "$head"
              elif [ "$mb" != "$base" ]; then
                warn "force-push: before $base is not an ancestor of $head; scanning from their merge base $mb"
                emit range "$mb" "$head"
              else
                emit range "$base" "$head"
              fi
            else
              warn "push before $before is not in this clone and could not be fetched (force-push): scanning the full history of $head"
              emit full "" "$head"
            fi
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target) ev_base=$PR_BASE; ev_head=$PR_HEAD; need_base=1 ;;
            merge_group) ev_base=$MG_BASE; ev_head=$MG_HEAD; need_base=1 ;;
            *) ev_base=""; ev_head=""; need_base=0 ;;
          esac
          b=${IN_BASE:-$ev_base}
          h=${IN_HEAD:-${ev_head:-HEAD}}
          head=$(commit "$h") || die "head $h is not a commit in this clone and could not be fetched"
          if [ -z "$b" ]; then
            [ "$need_base" = 1 ] && die "$EVENT_NAME run has no base commit: refusing to scan without a range"
            note "$EVENT_NAME run without a base: scanning the full history of $head"
            emit full "" "$head"
            exit 0
          fi
          base=$(commit "$b") || die "base $b is not a commit in this clone and could not be fetched: the scan would read nothing"
          [ "$base" != "$head" ] || die "base and head are the same commit ($head): nothing to scan"
          emit range "$base" "$head"

      # Scan the resolved range (mode full: base is empty, so the whole history of head).
      # Fail-closed: TruffleHog hardcodes --fail in the action, and --results=verified,unknown
      # means any verified leak OR any verification-error result trips exit 183 -> step fails
      # -> required check goes RED. (unverified is excluded to limit false-positive RED.)
      # --fail-on-scan-errors: without it every engine tested (3.95.5 to 3.99.2) logs an
      # unresolvable base or head as an error, scans 0 chunks and exits 0 (a green check).
      # Only mode `none` skips the step; a missing or unexpected mode still scans.
      # `version: "3.97.9"` pins the scanner CLI image to match the baseline sweep
      # (no :latest moving target). The action commit is SHA-pinned for supply-chain.
      - name: TruffleHog secret scan
        if: steps.range.outputs.mode != 'none'
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: "3.97.9"
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown --fail-on-scan-errors ${{ inputs.extra_args }}
