name: skills-drift-gate

# Reusable workflow (cinatra#188). v2 — watches-first with heuristic fallback.
#
# Flags when a cinatra PR change touches a surface an `assistant-skills`
# SKILL.md depends on, so the impacted skill is reviewed before it silently goes
# stale. Two-tier matching:
#   - DECLARED WATCHES (preferred, low false-positive): a SKILL.md declares a
#     `cinatra-watches:` block (primitives / packages / routes / source-path
#     globs); the gate matches those precise surfaces. In `enforce` mode an
#     UNACKNOWLEDGED declared-watch finding gates (exit 1).
#   - HEURISTIC FALLBACK (for skills with no watch block): verbatim identifier
#     match (MCP primitive / @cinatra-ai/* package / route string). Heuristic
#     findings are ADVISORY in every mode — reported, never gating.
# Fail-loud (exit 2): bad/unresolvable assistant-skills pin, zero SKILL.md,
# unresolvable diff base, or a malformed `cinatra-watches` block.
#
# Acknowledge a declared-watch finding with ONE of (cinatra#188 §Acknowledgement):
#   - `Skills-PR: <url-or-#n> covers: <skill-slug>[, ...]` — a linked skills-repo
#     PR naming the impacted skill(s). The ref is `#n` / `n` / `GH-n`, or a
#     github.com PULL URL on `assistant-skills` (the retired single pack) or on
#     any repo this caller PINS below (`skills_repos` / `skills_repo`) — so a
#     successor-repo acknowledgement validates and the ambiguous bare-number
#     workaround is no longer forced. Any other URL is rejected and reported; or
#   - `Skills-reviewed: <note>`; or
#   - `Skills-unaffected: <reason>` (reason REQUIRED — not `Skills-unaffected:` only).
#
# SCOPE: wired ONLY into the `cinatra` repo. NOT part of the org-wide
# min-repo-config rollout — no other repo calls it (cinatra is the only repo
# whose changes can drift the assistant-skills knowledge).
#
# A consuming repo (only cinatra) calls it from a thin caller. Two modes:
# SINGLE-repo (skills_repo + skills_ref) for one skills pack, or MULTI-repo
# (skills_repos: pinned `owner/name@sha` entries) for a skills surface spread
# across several repos (cinatra#2090 S3 — the assistant-skills successors);
# the union is scanned in ONE job so the required-check context is unchanged.
#
#   jobs:
#     skills-drift-gate:                       # <- stable caller JOB name
#       uses: cinatra-ai/ci/.github/workflows/skills-drift-gate.yml@<sha>  # vX.Y.Z
#       with:
#         skills_repos: |                      # each pinned in the caller's lock
#           cinatra-ai/chat-assistant-core-skill@<sha>
#           cinatra-ai/extension-authoring-skill@<sha>
#         mode: enforce                        # warn (advisory) | enforce (gates)
#         ref: <sha>
#
# A reusable workflow_call surfaces its required-check CONTEXT under the
# caller's job name, formatted "<caller-job> / <reusable-job>". Pin the caller
# job to `skills-drift-gate` and the reusable job (below) to `skills-drift-gate`
# so the required status check is "skills-drift-gate / skills-drift-gate".

on:
  workflow_call:
    inputs:
      skills_ref:
        description: "SINGLE-repo mode: skills git ref to check out. Pin to the repo's resolvedSha in the caller's required-extensions lock. Exactly ONE of skills_ref / skills_repos must be set — an empty pair fails loud: the gate must read a pinned snapshot, never a moving default branch."
        type: string
        default: ""
      skills_repo:
        description: "SINGLE-repo mode: skills repository (owner/name)."
        type: string
        default: "cinatra-ai/assistant-skills"
      skills_repos:
        description: "MULTI-repo mode (cinatra#2090 S3 — the watch-bearing SKILL.mds are spread across successor skill repos): whitespace/comma/newline-separated `owner/name@<40-hex-sha>` entries, each pinned to that repo's resolvedSha in the caller's required-extensions lock. The gate materializes the UNION of every repo's skills/<slug>/ bundles (scripts/materialize-skills-union.sh — fail-loud on a branch pin, a missing skills/ dir, or a duplicate slug) and scans it in ONE job, so the caller keeps its single stable required-check context. Mutually exclusive with skills_ref."
        type: string
        default: ""
      mode:
        description: "warn (non-failing; reports watch + heuristic findings) | enforce (gates an UNACKNOWLEDGED declared-watch finding; heuristic findings stay advisory)."
        type: string
        default: "warn"
      config:
        description: "Optional path (in the caller repo) to a per-repo JSON config (e.g. primitiveStopwords)."
        type: string
        default: ""
      ref:
        description: "Git ref of this gate repo (cinatra-ai/ci) to check out (pin to a SHA in production)."
        type: string
        default: "main"

permissions:
  contents: read
  # pull-requests:read serves BOTH description reads, and no further scope is
  # needed for either. (1) The PULL_REQUEST arm reads the PR's CURRENT
  # description (GET /repos/{repo}/pulls/{number}) instead of the copy frozen
  # into the event payload, so re-running a failed check picks up a description
  # the author edited in the meantime — see the resolve step below. (2) The PUSH
  # arm resolves the merged PR via the commit->PR association
  # (GET /commits/{sha}/pulls) and reads its body, so a PR-body-only
  # acknowledgement greens the post-merge run even when the squash body did not
  # repeat the marker as a trailer. Read-only; no write scope. NOTE (rollout): a
  # reusable workflow's permissions are capped by the CALLER — the caller's own
  # `permissions:` block must ALSO grant `pull-requests: read`, and requesting a
  # scope the caller lacks fails the run at startup. So bump the caller's pin and
  # add this scope to the caller ATOMICALLY. If a read fails anyway, the two arms
  # diverge deliberately: the pull_request arm FAILS CLOSED in `enforce` (a
  # verdict computed from a stale description is worse than no verdict), while
  # the push arm keeps degrading to commit trailers (it is a recovery source for
  # an already-merged commit, and failing there would red the default branch).
  pull-requests: read

jobs:
  skills-drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exactly one pinned skills source (fail loud on empty/both)
        env:
          SKILLS_REF: ${{ inputs.skills_ref }}
          SKILLS_REPOS: ${{ inputs.skills_repos }}
        run: |
          if [ -z "$SKILLS_REF" ] && [ -z "$SKILLS_REPOS" ]; then
            echo "::error::both skills_ref and skills_repos are empty. This gate must read PINNED skills snapshots (the resolvedSha entries in the caller's required-extensions lock), never a moving default branch." >&2
            exit 1
          fi
          if [ -n "$SKILLS_REF" ] && [ -n "$SKILLS_REPOS" ]; then
            echo "::error::skills_ref and skills_repos are both set — they are mutually exclusive (single-repo vs multi-repo mode)." >&2
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Checkout gate (cinatra-ai/ci)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: cinatra-ai/ci
          ref: ${{ inputs.ref }}
          path: .skills-drift-gate

      - name: Checkout skills repo (pinned, single-repo mode)
        if: inputs.skills_repos == ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.skills_repo }}
          ref: ${{ inputs.skills_ref }}
          path: .assistant-skills

      # Multi-repo mode: materialize the pinned UNION into the same
      # .assistant-skills/skills layout the engine already consumes — the scan
      # itself is repo-count-agnostic and the required-check context stays the
      # one caller-job context. The materializer is a versioned script with its
      # own regression test (scripts/__tests__/materialize-skills-union.test.mjs)
      # and validates every entry before it reaches git (fail-loud on branch
      # pins / malformed entries — the list is caller-influenceable input).
      - name: Materialize pinned skills union (multi-repo mode)
        if: inputs.skills_repos != ''
        env:
          SKILLS_REPOS: ${{ inputs.skills_repos }}
          UNION_DIR: .assistant-skills
        run: |
          bash .skills-drift-gate/scripts/materialize-skills-union.sh

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      # Branch names, PR bodies, and config paths are attacker-influenceable, so
      # every value below is passed through an env var and never interpolated
      # directly into a shell line (no command injection via a crafted ref).
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      # Resolve the diff base via the shared resolver (single source of truth,
      # regression-locked by scripts/__tests__/resolve-diff-base.test.mjs) so this
      # gate diffs the same base under test and in production and posts correct
      # incremental status on a merge_group (merge-queue) candidate. On
      # merge_group the base_sha is an ancestor of the checked-out candidate HEAD
      # (fetch-depth: 0 above), so it is reachable without an extra fetch.
      - name: Compute diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          printf 'ref=%s\n' "$(bash .skills-drift-gate/scripts/resolve-diff-base.sh)" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned skills SHA(s) (fail loud if unresolvable)
        id: pin
        env:
          SKILLS_REF: ${{ inputs.skills_ref }}
          SKILLS_REPOS: ${{ inputs.skills_repos }}
        run: |
          if [ -n "$SKILLS_REPOS" ]; then
            # Multi-repo mode: the materializer above already fetched each repo
            # at EXACTLY its pinned SHA (or failed loud). Report the pins as
            # the engine's display ref.
            PINS="$(printf '%s' "$SKILLS_REPOS" | tr ',\n' '  ' | xargs)"
            echo "sha=$PINS" >> "$GITHUB_OUTPUT"
            echo "skills union pinned at: $PINS"
          else
            SHA="$(git -C .assistant-skills rev-parse HEAD)"
            if [ -z "$SHA" ]; then
              echo "::error::could not resolve the skills pin (skills_ref='$SKILLS_REF')." >&2
              exit 1
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "skills repo pinned at $SHA"
          fi

      # On push (a squash-merge to main) the event carries no PR body, yet the
      # acknowledgement marker may live ONLY in the PR body (the squash body need
      # not repeat it as a trailer). Resolve the merged PR via the commit->PR
      # association and stage its body so the collector can fold it in — the SAME
      # trust source the pull_request arm reads (an unbound self-attestation
      # recorded on the PR; not approval-bound in either arm). RECOVERY source
      # only: a direct push with no associated PR, an ambiguous association, or
      # any API/permission miss leaves the file EMPTY, so only commit trailers are
      # then available (fail-closed, unchanged from before). The body is written
      # to a FILE (never an env interpolation or a GITHUB_ENV heredoc) so an
      # attacker-crafted body cannot inject a delimiter or a shell line; the SHA
      # reaches jq via `env`, never string-interpolated into the filter.
      - name: Resolve merged PR body (push)
        id: prbody
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/skills-pr-body.txt"
          : > "$out"
          # The PR whose squash landed THIS commit on the default branch: the
          # single association whose merge_commit_sha == the pushed SHA. Zero or
          # more than one exact match => ambiguous => empty body (fail-closed to
          # trailers). No blind "first PR".
          PR_NUMBER="$(gh api "/repos/$REPO/commits/$MERGE_SHA/pulls" \
            --jq '[ .[] | select(.merge_commit_sha == env.MERGE_SHA) | .number ] | if length == 1 then .[0] else empty end' \
            2>/dev/null || true)"
          # `source` records whether a description was actually read, so the
          # engine's remediation hint describes THIS run (a post-merge run that
          # read the merged PR's body live vs a direct push with no PR to read).
          # It does not change this arm's fail-open contract: any miss still
          # leaves the body empty and falls back to commit trailers.
          source=unavailable
          if [ -n "$PR_NUMBER" ]; then
            if gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '.body // empty' > "$out" 2>/dev/null; then
              source=live
            else
              # Say so rather than degrade in silence: an acknowledgement that
              # lived only in the PR description is now unreadable, so a finding
              # can red the default branch with no visible reason.
              echo "::warning::could not read the merged pull request's description (PR #$PR_NUMBER). Falling back to commit trailers: an acknowledgement recorded only in the description is not visible to this run." >&2
              : > "$out"
            fi
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      # THE RE-RUN TRAP, CLOSED. `github.event.pull_request.body` is a FROZEN
      # snapshot of the description: "Re-run failed jobs" replays the original
      # payload, so an acknowledgement the author ADDS to the description after a
      # red run is invisible to every re-run — the check stays red no matter what
      # they write, and only a new push or a close/reopen (a fresh event) clears
      # it. This step reads the description from the API at run time instead, so
      # a plain re-run sees the edit. Only the IDENTITY (repository + PR number)
      # comes from the payload; neither can be changed by editing the PR.
      #
      # It FAILS CLOSED: on a read failure the script never falls back to the
      # payload copy (that fallback IS the trap) — in `enforce` it exits 1 with
      # an error annotation; in `warn` (which never gates) it warns, stages an
      # EMPTY file and reports `unavailable`. The body is written to a FILE, and
      # `source` is forwarded so the engine's remediation hint matches how this
      # run actually read the description.
      #
      # No trust change: the description is author-controlled either way. The ack
      # is an unbound self-attestation recorded on the PR, before and after —
      # reading it live changes FRESHNESS, not authority.
      - name: Resolve PR description live (pull_request)
        id: prlive
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ inputs.mode }}
          OUT: ${{ runner.temp }}/pr-body-live.txt
        run: |
          resolver="$GITHUB_WORKSPACE/.skills-drift-gate/scripts/resolve-pr-body.sh"
          # The gate CODE comes from the 'ref' input while this workflow comes
          # from the caller's `uses:` ref. Pinning 'ref' to an older commit than
          # the workflow leaves no resolver here; say so instead of dying on a
          # command-not-found, which reads like a gate bug rather than a pin one.
          if [ ! -f "$resolver" ]; then
            echo "::error::this gate checkout has no live description resolver — the 'ref' input points at a commit older than this workflow. Pin the 'ref' input and the caller's 'uses:' ref to the SAME cinatra-ai/ci commit." >&2
            exit 1
          fi
          bash "$resolver" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      # Runs on BOTH pull_request AND push (e.g. squash-merge to main). The
      # acknowledgement marker (Skills-PR / Skills-reviewed / Skills-unaffected)
      # can live in the PR body OR a commit message; on a squash merge it lands
      # in the squash commit body, which is HEAD on main. The script reads acks
      # ONLY from --ack-file, so the push arm MUST collect them too — otherwise a
      # declared-watch finding fails on push even though the squash body
      # acknowledged it (the required gate would red main with no way to clear).
      # Branch names, PR bodies, and SHAs are attacker-influenceable, so every
      # value is passed via env and never interpolated into a shell line.
      - name: Collect acknowledgements (PR body + commit trailers)
        id: acks
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The payload copy of the description — UNUSED by this pin (whenever a
          # live read is wired, ACK_SOURCE decides and the collector reads the
          # staged file). It is still passed because the collector's legacy arm
          # reads this variable, and that arm is what keeps a caller running an
          # OLDER workflow against a newer gate checkout ('ref' defaults to the
          # default branch) reading descriptions at all.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          # Exactly ONE of the two resolve steps runs per event (pull_request vs
          # push), so the skipped one contributes an empty string: on a PR this is
          # the live-read description, on a push the merged-PR body, and on any
          # other event neither (the collector ignores an empty PR_BODY_FILE).
          PR_BODY_FILE: ${{ steps.prbody.outputs.file }}${{ steps.prlive.outputs.file }}
          # How the description reaching the collector was obtained (live |
          # unavailable) — from whichever resolve step ran, empty on any other
          # event. It tells the pull_request arm which copy is authoritative (and
          # that the payload copy is never a fallback), and reaches the engine as
          # --ack-source below.
          ACK_SOURCE: ${{ steps.prbody.outputs.source }}${{ steps.prlive.outputs.source }}
        run: |
          # The collection logic lives in a single shared script so the push-arm
          # behaviour shipped here and the behaviour under test
          # (scripts/__tests__/collect-skills-acks.test.mjs) can never drift.
          # Runs in the caller repo's working dir so HEAD / the squash body are
          # the caller's; the script reads only env (no shell interpolation of
          # attacker-influenceable refs).
          bash "$GITHUB_WORKSPACE/.skills-drift-gate/scripts/collect-skills-acks.sh" \
            > "$RUNNER_TEMP/skills-acks.txt"
          echo "file=$RUNNER_TEMP/skills-acks.txt" >> "$GITHUB_OUTPUT"

      - name: Run skills-drift-gate (WARN)
        env:
          SKILLS_DRIFT_DIFF_BASE: ${{ steps.base.outputs.ref }}
          SKILLS_DRIFT_PINNED_REF: ${{ steps.pin.outputs.sha }}
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
          ACK_FILE: ${{ steps.acks.outputs.file }}
          # The caller's OWN pinned skills repos, handed to the engine so the
          # `Skills-PR:` URL arm accepts a pull URL on the repos actually in the
          # pinned skills universe (the successor repos of the retired single
          # pack) instead of only the retired repo name. Passed verbatim: the
          # engine parses `owner/name` / `owner/name@<ref>` entries and IGNORES
          # anything else, so this can only ever widen the ack grammar to
          # caller-pinned repos — never to an arbitrary URL a PR body names.
          # Same trust level as `mode:` (pinned caller config, not PR input).
          SKILLS_REPOS: ${{ inputs.skills_repos }}
          SKILLS_REPO: ${{ inputs.skills_repo }}
          # How this run read the PR description (live | unavailable), so the
          # engine's remediation hint describes what actually happened. Empty
          # only when neither resolve step ran, where the engine's conservative
          # default is the honest answer.
          ACK_SOURCE: ${{ steps.prbody.outputs.source }}${{ steps.prlive.outputs.source }}
        run: |
          # Neither resolve step ran (an event with no pull request to read from,
          # e.g. a merge-queue candidate): this run read NO description, which is
          # `unavailable` — never the payload copy. Passing it explicitly leaves
          # the engine's `event` default reachable only from a workflow that
          # predates the live read, which is exactly what that default describes.
          # Such a run has always seen commit messages only, so an acknowledgement
          # recorded solely in a description does not reach it — unchanged here,
          # and now stated in the failure rather than left to be guessed at.
          [ -n "$ACK_SOURCE" ] || ACK_SOURCE=unavailable
          args=( --skills-dir .assistant-skills/skills --mode "$MODE" )
          [ -n "$CONFIG" ] && args+=( --config "$CONFIG" )
          [ -n "$ACK_FILE" ] && args+=( --ack-file "$ACK_FILE" )
          # The ENGINE comes from the 'ref' checkout while this workflow comes
          # from the caller's `uses:` ref. An engine older than this workflow
          # rejects an unknown flag and exits, so probe the engine about to run
          # rather than assume the pins match: on a skewed pin this check keeps
          # working (on its old, payload-reading terms) and says why, instead of
          # aborting with "unknown flag". The pull_request arm has already failed
          # loud by this point — there, a stale description could decide a verdict.
          if grep -q -- '"ack-source"' .skills-drift-gate/scripts/skills-drift-gate.mjs; then
            args+=( --ack-source "$ACK_SOURCE" )
          else
            echo "::warning::this gate checkout predates the live description read — the 'ref' input points at a commit older than this workflow. Pin the 'ref' input and the caller's 'uses:' ref to the SAME cinatra-ai/ci commit. Until then this check reads the description from the event payload, so re-running it after editing the description replays the pre-edit copy." >&2
          fi
          # Multi-repo mode pins the whole set; single-repo mode pins exactly one
          # repo (skills_repo). Values reach the engine as ARRAY ELEMENTS via env
          # — never interpolated into a shell line (the injection discipline this
          # workflow follows throughout).
          if [ -n "$SKILLS_REPOS" ]; then
            args+=( --skills-repos "$SKILLS_REPOS" )
          elif [ -n "$SKILLS_REPO" ]; then
            args+=( --skills-repos "$SKILLS_REPO" )
          fi
          node .skills-drift-gate/scripts/skills-drift-gate.mjs "${args[@]}"
